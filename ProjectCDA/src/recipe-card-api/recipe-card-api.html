<div
  class="card flex flex-col bg-white w-[178px] mb-4 font-monserrat rounded-2xl shadow-md transition hover:shadow-lg
         sm:w-[200px] md:w-[220px] lg:w-full"
  *ngIf="recette"
>
  <!-- Image inchangée -->
  <img
    class="w-full h-[100px] sm:h-[120px] md:h-[140px] lg:h-[300px] object-cover rounded-t-2xl"
    [src]="imageUrl"
    alt="{{ recette?.recipeName || 'Image non disponible' }}"
  />

  <!-- Texte juste en dessous -->
  <div class="mx-2 mt-2 flex flex-col gap-1">
    <h3 class="text-[16px] sm:text-[17px] md:text-[18px] lg:text-[24px] font-semibold text-center line-clamp-2">
      {{ recette?.recipeName }}
    </h3>

    <div class="flex justify-between items-center mt-1">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-alarm-clock text-orangeJUP text-[13px] sm:text-[14px] md:text-[15px] lg:text-[18px]"></i>
        <p class="text-[13px] sm:text-[14px] md:text-[15px] lg:text-[16px]">
          {{ formatTime((recette?.prep_time || 0) + (recette?.cook_time || 0)) }}
        </p>
      </div>

      <div class="flex items-center gap-2">
        <i class="fa-solid fa-utensils text-orangeJUP text-[13px] sm:text-[14px] md:text-[15px] lg:text-[18px]"></i>
        <p class="text-[13px] sm:text-[14px] md:text-[15px] lg:text-[16px]">{{ recette?.difficulty?.name }}</p>
      </div>
    </div>
  </div>
</div>
